version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: tnc-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: tnc_prod
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - tnc-network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d tnc_prod -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/yeskela7/backend-tnc:latest
    container_name: tnc-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tnc_prod
      DATABASE_USERNAME: ${DB_USERNAME}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      PROFILE: prod
      CORS_ALLOWED_ORIGINS: https://tnc.az,http://localhost:3000
      SWAGGER_ENABLED: "false"
      DROP_FIRST: "false"
      JWT_SECRET: ${JWT_SECRET}
      FILE_UPLOAD_DIR: /var/app/uploads
      FILE_BASE_URL: https://tnc.az
    volumes:
      - ./uploads:/var/app/uploads
    networks:
      - tnc-network
    expose:
      - "8080"
    mem_limit: 768m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ghcr.io/kamran134/tnc:latest
    container_name: tnc-website-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_SITE_URL: https://tnc.az
      BACKEND_URL: http://backend:8080
    networks:
      - tnc-network
    expose:
      - "3000"
    pull_policy: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: tnc-nginx-prod
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - ./uploads:/var/www/uploads:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - tnc-network
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tnc-network:
    driver: bridge
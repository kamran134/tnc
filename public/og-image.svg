<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient (sky blue like the website) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow for depth -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="150" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="180" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Main content container -->
  <rect x="80" y="120" width="1040" height="390" rx="20" fill="rgba(255,255,255,0.95)" filter="url(#shadow)"/>
  
  <!-- Logo area (TnC) -->
  <text x="600" y="230" font-family="Montserrat, sans-serif" font-size="120" font-weight="800" fill="#0ea5e9" text-anchor="middle">
    TnC
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="310" font-family="Montserrat, sans-serif" font-size="32" font-weight="600" fill="#334155" text-anchor="middle">
    Tax &amp; Consulting
  </text>
  
  <!-- Tagline -->
  <text x="600" y="360" font-family="Montserrat, sans-serif" font-size="24" font-weight="400" fill="#64748b" text-anchor="middle">
    Professional Tax and Legal Services
  </text>
  
  <!-- Service icons with labels -->
  <g transform="translate(200, 410)">
    <!-- Tax icon -->
    <g>
      <rect x="0" y="0" width="60" height="60" rx="12" fill="#0ea5e9" opacity="0.1"/>
      <text x="30" y="40" font-size="30" text-anchor="middle">📊</text>
      <text x="30" y="85" font-family="Montserrat, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="middle">Tax</text>
    </g>
    
    <!-- Legal icon -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="60" height="60" rx="12" fill="#0ea5e9" opacity="0.1"/>
      <text x="30" y="40" font-size="30" text-anchor="middle">⚖️</text>
      <text x="30" y="85" font-family="Montserrat, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="middle">Legal</text>
    </g>
    
    <!-- Accounting icon -->
    <g transform="translate(400, 0)">
      <rect x="0" y="0" width="60" height="60" rx="12" fill="#0ea5e9" opacity="0.1"/>
      <text x="30" y="40" font-size="30" text-anchor="middle">💼</text>
      <text x="30" y="85" font-family="Montserrat, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="middle">Consulting</text>
    </g>
    
    <!-- Finance icon -->
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="60" height="60" rx="12" fill="#0ea5e9" opacity="0.1"/>
      <text x="30" y="40" font-size="30" text-anchor="middle">💰</text>
      <text x="30" y="85" font-family="Montserrat, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="middle">Finance</text>
    </g>
  </g>
  
  <!-- Website URL at bottom -->
  <text x="600" y="585" font-family="Montserrat, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="middle" opacity="0.9">
    tnc.az
  </text>
</svg>

# ============================================================================
# LOCAL DEV STACK  -  a faithful, offline copy of production (tnc.az)
# ----------------------------------------------------------------------------
#   postgres  : prod DB snapshot, auto-restored on first boot
#   backend   : built from ../backend-tnc  (Spring Boot, profile: prod,localdev)
#   app       : built from .               (Next.js standalone, same as prod)
#   nginx     : same routing as the server, http only, on http://localhost:8090
#
# Nothing here talks to the production server. Safe to up/down/destroy freely.
#
#   Start:   docker compose -f docker-compose.dev.yml up -d --build
#   Open:    http://localhost:8090
#   Stop:    docker compose -f docker-compose.dev.yml down
#   Reset DB:docker compose -f docker-compose.dev.yml down -v   (re-restores snapshot next up)
#
# Direct ports (bound to 127.0.0.1 only):
#   8090 -> nginx (use this)      3000 -> next.js      8080 -> backend      5432 -> postgres
# ============================================================================

services:
  postgres:
    image: postgres:16
    container_name: tnc-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tnc_prod}
      POSTGRES_USER: ${DB_USERNAME:-tnc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tnc_local_dev}
    volumes:
      - tnc_dev_pgdata:/var/lib/postgresql/data
      - ./dev-local/db/tnc_prod.dump:/backup/tnc_prod.dump:ro
      - ./dev-restore-db.sh:/docker-entrypoint-initdb.d/00-restore.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tnc_user} -d ${DB_NAME:-tnc_prod} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend-tnc
      dockerfile: Dockerfile
    image: tnc-backend-dev:local
    container_name: tnc-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROFILE: "prod,localdev"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tnc_prod}
      DATABASE_USERNAME: ${DB_USERNAME:-tnc_user}
      DATABASE_PASSWORD: ${DB_PASSWORD:-tnc_local_dev}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-key-at-least-256-bits-long-000000000000000000}
      CORS_ALLOWED_ORIGINS: "http://localhost:8090,http://localhost:3000"
      SWAGGER_ENABLED: "true"
      DROP_FIRST: "false"
      APP_ANTIVIRUS_ENABLED: "false"
      FILE_UPLOAD_DIR: /var/app/uploads
      FILE_BASE_URL: http://localhost:8090
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx700m -XX:+UseContainerSupport"
    volumes:
      - ./dev-local/uploads:/var/app/uploads
    ports:
      - "127.0.0.1:8080:8080"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-G-GQPC41V59T}
        BACKEND_URL: http://backend:8080
    image: tnc-app-dev:local
    container_name: tnc-website-dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_SITE_URL: http://localhost:8090
      BACKEND_URL: http://backend:8080
      NODE_OPTIONS: "--max-old-space-size=1200"
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:alpine
    container_name: tnc-nginx-dev
    restart: unless-stopped
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./dev-local/uploads:/var/www/uploads:ro
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - app
      - backend

volumes:
  tnc_dev_pgdata:

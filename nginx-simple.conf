events {}

http {
  server {
    listen 80;
    server_name tnc.az www.tnc.az;

    # редирект с http -> https
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name tnc.az www.tnc.az;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Логи
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ========================================================================
    # СПЕЦИАЛЬНЫЕ РОУТЫ ДЛЯ АУТЕНТИФИКАЦИИ
    # Эти endpoints идут через Next.js для установки HTTP-only cookies
    # ВАЖНО: Должны быть ПЕРЕД общим /api/ блоком!
    # ========================================================================

    # /api/auth/login - вход, устанавливает cookies
    location = /api/auth/login {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # /api/auth/logout - выход, удаляет cookies
    location = /api/auth/logout {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # /api/auth/refresh - обновление токенов, обновляет cookies
    location = /api/auth/refresh {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # ========================================================================
    # ВСЕ ОСТАЛЬНЫЕ API ЗАПРОСЫ → JAVA BACKEND
    # ========================================================================
    location /api/ {
      proxy_pass http://backend:8080;
      proxy_http_version 1.1;

      # Заголовки для правильной работы
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

      # WebSocket support
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Таймауты
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # Все остальное → фронт
    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;

      # Заголовки для правильной работы Next.js
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

      # WebSocket support для Next.js HMR
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Cookie настройки
      proxy_cookie_path / /;
      proxy_cookie_domain $host $host;

      # Таймауты
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }
  }
}

# Продакшн конфигурация Docker Compose
# Используйте этот файл на сервере для production деплоя
# Образы автоматически собираются в GitHub Actions и загружаются в GHCR

version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: tnc-postgres-prod
    restart: unless-stopped
    environment:
      - POSTGRES_DB=tnc_prod
      - POSTGRES_USER=tnc_user
      - POSTGRES_PASSWORD=change_this_password  # ВАЖНО: Смените в production!
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - tnc-network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tnc_user -d tnc_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/yeskela7/backend-tnc:master-e4e85fa
    container_name: tnc-backend-prod
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tnc_prod
      - SPRING_DATASOURCE_USERNAME=tnc_user
      - SPRING_DATASOURCE_PASSWORD=change_this_password  # ВАЖНО: Смените в production!
      - JWT_SECRET=your-very-long-secret-key-at-least-256-bits-long-for-production-use  # ВАЖНО: Смените!
      - CORS_ALLOWED_ORIGINS=https://tnc.az,https://www.tnc.az
      - FILE_UPLOAD_DIR=/var/app/uploads
      - SWAGGER_ENABLED=false  # Отключите swagger в production для безопасности
    volumes:
      - ./uploads:/var/app/uploads
    networks:
      - tnc-network
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  app:
    image: ghcr.io/kamran134/tnc:latest
    container_name: tnc-website-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # NEXT_PUBLIC_API_BASE_URL уже зашит в образ при сборке в GitHub Actions
      - BACKEND_URL=http://backend:8080  # Для Next.js API routes (server-side)
    networks:
      - tnc-network
    expose:
      - "3000"
    pull_policy: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: tnc-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - ./certbot/www:/var/www/certbot:ro  # Для Let's Encrypt
    depends_on:
      - app
      - backend
    networks:
      - tnc-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  tnc-network:
    driver: bridge

# Команды для обновления (Docker Compose V2):
# docker compose -f docker-compose.prod.yml pull   # Загрузка новых образов
# docker compose -f docker-compose.prod.yml up -d  # Перезапуск с новыми образами
# docker compose -f docker-compose.prod.yml logs -f  # Просмотр логов
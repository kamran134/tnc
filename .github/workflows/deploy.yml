name: Build and Deploy to Server

on:
  push:
    branches: [ main ]
  # Бэкенд (yeskela7/backend-tnc) после публикации своего образа дёргает этот workflow,
  # чтобы сервер подхватил новый backend без пуша во фронтенд
  repository_dispatch:
    types: [ backend-updated ]
  workflow_dispatch: {}

# Деплои на прод сериализуются: очередь, а не отмена — иначе новый пуш
# оборвёт развёртывание на середине и оставит сервер в промежуточном состоянии
concurrency:
  group: prod-deploy
  cancel-in-progress: false

# Добавляем права для работы с packages
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kamran134/tnc

jobs:
  build-and-push:
    # Убираем тесты для ускорения
    # needs: test
    runs-on: ubuntu-latest
    # При запуске от бэкенда фронт пересобирать не нужно — только задеплоить
    if: github.event_name != 'repository_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
        # Преобразуем в lowercase для GHCR
        flavor: |
          latest=auto
          prefix=
          suffix=

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1
          NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL_2 }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # success — обычный пуш во фронт; skipped — прилетел repository_dispatch от бэкенда
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')

    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST_HETZNER }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY_2 }}
        port: ${{ secrets.PORT }}
        script: |
          set -e
          cd /opt/tnc-website

          # Записываем .env файл из GitHub Secrets (перезаписываем при каждом деплое)
          cat > .env << 'EOF'
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF
          chmod 600 .env

          # Авторизация в GitHub Container Registry
          echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Снимаем заглушку техработ, если она висит: она занимает сетевой алиас app,
          # и без этого nginx будет балансировать между заглушкой и приложением
          docker rm -f tnc-maintenance 2>/dev/null || true

          # Тянем только нужные образы и пересоздаём только изменившиеся контейнеры.
          # Намеренно без "docker compose down": он удаляет контейнеры целиком,
          # включая остановленные, которые могут быть нужны для разбора инцидентов
          docker compose -f docker-compose.yml pull app backend
          docker compose -f docker-compose.yml up -d app backend

          # Очистка только висячих (dangling) образов — теги не трогает
          docker image prune -f

          # Проверка состояния контейнеров
          docker compose -f docker-compose.yml ps

          # Показать логи для проверки запуска
          docker compose -f docker-compose.yml logs app --tail=20
          docker compose -f docker-compose.yml logs backend --tail=20

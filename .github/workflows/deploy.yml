name: Build and Deploy to Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Добавляем права для работы с packages
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kamran134/tnc

jobs:
  # Быстрая проверка кода (только линтинг)
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
            
    - name: Install dependencies
      run: npm ci
        
    - name: Run linting
      run: npm run lint

  # Сборка и публикация Docker образа
  build-and-push:
    needs: lint  # Зависит только от линтинга
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
        flavor: |
          latest=auto
          prefix=
          suffix=

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        # ОПТИМИЗАЦИЯ: Только amd64 (в 2-3 раза быстрее!)
        # Если нужен arm64 (Apple Silicon, Raspberry Pi), раскомментируйте:
        # platforms: linux/amd64,linux/arm64
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Используем GitHub Actions cache для ускорения
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # Build-time аргументы для Next.js
        build-args: |
          BUILDKIT_INLINE_CACHE=1
          NEXT_PUBLIC_API_BASE_URL=https://tnc.az/api

  # Деплой на сервер
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          # Переход в директорию проекта
          cd /opt/tnc-website
          
          # Авторизация в GitHub Container Registry
          echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Загрузка нового образа из GHCR
          docker compose -f docker-compose.prod.yml pull app
          
          # Перезапуск только frontend (zero-downtime)
          docker compose -f docker-compose.prod.yml up -d app
          
          # Очистка старых образов для экономии места
          docker image prune -f
          
          # Проверка состояния контейнеров
          docker compose -f docker-compose.prod.yml ps
          
          # Показать логи для проверки запуска
          docker compose -f docker-compose.prod.yml logs app --tail=20
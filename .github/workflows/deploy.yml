name: Build and Deploy to Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Отменяем предыдущие запуски при новом пуше
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Добавляем права для работы с packages
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kamran134/tnc

jobs:
  build-and-push:
    # Убираем тесты для ускорения
    # needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
        # Преобразуем в lowercase для GHCR
        flavor: |
          latest=auto
          prefix=
          suffix=

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1
          NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL_2 }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST_HETZNER }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY_2 }}
        port: ${{ secrets.PORT }}
        script: |
          # Переход в директорию проекта
          cd /opt/tnc-website
          
          # Авторизация в GitHub Container Registry
          echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Остановка текущих контейнеров
          docker compose -f docker-compose.yml down app
          
          # Загрузка нового образа из GHCR
          docker compose -f docker-compose.yml pull
          
          # Запуск новых контейнеров с обновленным образом
          docker compose -f docker-compose.yml up -d app
          
          # Очистка старых образов для экономии места
          docker image prune -f
          
          # Проверка состояния контейнеров
          docker compose -f docker-compose.yml ps
          
          # Показать логи для проверки запуска
          docker compose -f docker-compose.yml logs app --tail=20